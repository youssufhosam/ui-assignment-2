<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explore Laptops | Laptop Finder</title><link rel="stylesheet" href="dist/output.css"><script type="module" src="src/js/laptops.js"></script></head>
<body class="min-h-screen bg-canvas font-sans text-ink transition-colors"><a href="#main" class="sr-only focus:not-sr-only">Skip to content</a><header id="header" class="border-b border-line"></header><main id="main" class="mx-auto max-w-7xl px-5 py-10 sm:px-8 lg:py-14"><p class="eyebrow">The campus collection</p><h1 class="page-title">Find your kind of laptop.</h1><p class="mt-4 text-muted">A few filters. A much smarter shortlist. All prices in USD.</p>
<form id="filters" class="my-8 grid items-end gap-4 rounded-2xl border border-line bg-soft p-5 sm:grid-cols-2 lg:grid-cols-5" role="search"><label class="text-sm font-bold">Search laptops<input id="search" type="search" placeholder="Name or brand..." class="field mt-2"></label><label class="text-sm font-bold">Category<select id="category" class="field mt-2"><option value="">All categories</option><option value="ultrabook">Ultrabook</option><option value="gaming">Gaming</option><option value="2-in-1">2-in-1</option><option value="creator">Creator</option><option value="budget">Budget</option></select></label><label class="text-sm font-bold">Maximum price ($)<input id="price" type="number" min="0" step="50" placeholder="No limit" class="field mt-2"></label><label class="text-sm font-bold">Minimum RAM<select id="ram" class="field mt-2"><option value="0">Any memory</option><option value="8">8 GB+</option><option value="16">16 GB+</option><option value="32">32 GB+</option></select></label><label class="text-sm font-bold">Sort by<select id="sort" class="field mt-2"><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="batteryHours-desc">Battery: longest first</option><option value="batteryHours-asc">Battery: shortest first</option><option value="weightKg-asc">Weight: lightest first</option><option value="weightKg-desc">Weight: heaviest first</option></select></label><button type="reset" class="justify-self-start text-sm font-bold text-accent underline underline-offset-4">Reset filters</button></form>
<div class="mb-5 flex items-center justify-between"><p id="result-count" role="status" class="font-mono text-xs text-muted">Loading the collection...</p><span class="eyebrow">Your next chapter starts here</span></div><section id="catalogue" aria-label="Laptop results" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></section></main><p id="notification" role="status" aria-live="polite" class="mx-auto max-w-7xl px-5 py-3 text-sm text-accent"></p><footer id="footer" class="border-t border-line"></footer></body></html>
