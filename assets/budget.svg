<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="bd-title bd-desc">
  <title id="bd-title">Budget laptop</title>
  <desc id="bd-desc">Flat vector illustration of a warm amber budget laptop whose screen shows a friendly sunrise scene with a simple bar chart.</desc>
  <defs>
    <linearGradient id="bd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#ffe1bd"/>
    </linearGradient>
    <linearGradient id="bd-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.5" stop-color="#e3d6c3"/>
      <stop offset="1" stop-color="#bfae95"/>
    </linearGradient>
    <linearGradient id="bd-wall" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb648"/>
      <stop offset="0.5" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#c9455f"/>
    </linearGradient>
    <pattern id="bd-keys" width="26" height="20" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="22" height="16" rx="4" fill="#4a3a2b" fill-opacity="0.88"/>
    </pattern>
    <clipPath id="bd-scr">
      <rect x="177" y="72" width="446" height="286" rx="10"/>
    </clipPath>
    <clipPath id="bd-kb">
      <path d="M150 386 H650 L670 414 H130 Z"/>
    </clipPath>
    <filter id="bd-blur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="30" fill="url(#bd-bg)"/>
  <circle cx="400" cy="235" r="160" fill="#ffffff" opacity="0.45" filter="url(#bd-blur)"/>
  <circle cx="215" cy="140" r="80" fill="#ff9f1c" opacity="0.2" filter="url(#bd-blur)"/>
  <ellipse cx="400" cy="452" rx="245" ry="16" fill="#6b4a26" opacity="0.18" filter="url(#bd-blur)"/>

  <g>
    <rect x="165" y="60" width="470" height="310" rx="18" fill="url(#bd-metal)"/>
    <rect x="177" y="72" width="446" height="286" rx="10" fill="#3a1f18"/>
    <g clip-path="url(#bd-scr)">
      <rect x="177" y="72" width="446" height="286" fill="url(#bd-wall)"/>
      <circle cx="400" cy="196" r="54" fill="#fff3c4" opacity="0.95"/>
      <g stroke="#fff3c4" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round">
        <path d="M400 112 L400 88"/>
        <path d="M400 280 L400 304"/>
        <path d="M316 196 L292 196"/>
        <path d="M484 196 L508 196"/>
        <path d="M338 134 L322 118"/>
        <path d="M462 134 L478 118"/>
      </g>
      <path d="M150 322 C 250 286, 320 336, 420 306 S 560 274, 670 306 L 670 370 L 150 370 Z" fill="#8f3a2f" opacity="0.45"/>
      <path d="M150 340 C 260 316, 330 350, 440 332 S 580 312, 670 330 L 670 370 L 150 370 Z" fill="#6b2c3a" opacity="0.5"/>
      <g>
        <rect x="212" y="286" width="26" height="42" rx="6" fill="#ffffff" opacity="0.55"/>
        <rect x="248" y="266" width="26" height="62" rx="6" fill="#ffffff" opacity="0.7"/>
        <rect x="284" y="240" width="26" height="88" rx="6" fill="#ffffff" opacity="0.9"/>
        <rect x="320" y="300" width="26" height="28" rx="6" fill="#ffffff" opacity="0.45"/>
      </g>
      <g fill="#ffffff" opacity="0.5">
        <circle cx="560" cy="140" r="7"/>
        <circle cx="592" cy="118" r="4.5"/>
        <circle cx="536" cy="112" r="4"/>
      </g>
      <path d="M177 72 H 320 L 210 358 H 177 Z" fill="#ffffff" opacity="0.1"/>
    </g>
    <rect x="177" y="72" width="446" height="286" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="400" cy="66" r="3" fill="#ab9a80"/>
    <rect x="382" y="362" width="36" height="4" rx="2" fill="#ab9a80"/>
  </g>

  <rect x="185" y="360" width="430" height="18" rx="9" fill="#ab9a80"/>

  <path d="M128 372 H672 L704 430 Q708 442 695 442 H105 Q92 442 96 430 Z" fill="url(#bd-metal)"/>
  <g clip-path="url(#bd-kb)">
    <rect x="120" y="380" width="560" height="40" fill="url(#bd-keys)"/>
  </g>
  <path d="M150 386 H650 L670 414 H130 Z" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="344" y="418" width="112" height="18" rx="6" fill="#cdbb9f" stroke="#ffffff" stroke-opacity="0.5"/>
  <path d="M104 441 H696" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M150 372 H650" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
</svg>
