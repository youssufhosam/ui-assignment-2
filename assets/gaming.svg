<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="gm-title gm-desc">
  <title id="gm-title">Gaming laptop</title>
  <desc id="gm-desc">Flat vector illustration of a dark gaming laptop with RGB lit chassis and a neon retro grid wallpaper with glowing shards.</desc>
  <defs>
    <linearGradient id="gm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <linearGradient id="gm-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f52"/>
      <stop offset="0.5" stop-color="#232736"/>
      <stop offset="1" stop-color="#151825"/>
    </linearGradient>
    <linearGradient id="gm-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b2e"/>
      <stop offset="0.55" stop-color="#1b0f42"/>
      <stop offset="1" stop-color="#3d0f63"/>
    </linearGradient>
    <linearGradient id="gm-rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#3ff0ff"/>
    </linearGradient>
    <pattern id="gm-keys" width="26" height="20" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="22" height="16" rx="4" fill="#0d1020" fill-opacity="0.95"/>
    </pattern>
    <clipPath id="gm-scr">
      <rect x="177" y="72" width="446" height="286" rx="10"/>
    </clipPath>
    <clipPath id="gm-kb">
      <path d="M150 386 H650 L670 414 H130 Z"/>
    </clipPath>
    <filter id="gm-blur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="30" fill="url(#gm-bg)"/>
  <circle cx="400" cy="240" r="180" fill="#8a2be2" opacity="0.28" filter="url(#gm-blur)"/>
  <circle cx="250" cy="150" r="90" fill="#ff2bd6" opacity="0.18" filter="url(#gm-blur)"/>
  <ellipse cx="400" cy="452" rx="250" ry="16" fill="#000000" opacity="0.6" filter="url(#gm-blur)"/>

  <g>
    <rect x="165" y="60" width="470" height="310" rx="18" fill="url(#gm-metal)"/>
    <rect x="165" y="60" width="470" height="310" rx="18" fill="none" stroke="url(#gm-rgb)" stroke-width="3" stroke-opacity="0.85"/>
    <rect x="177" y="72" width="446" height="286" rx="10" fill="#06040f"/>
    <g clip-path="url(#gm-scr)">
      <rect x="177" y="72" width="446" height="286" fill="url(#gm-wall)"/>
      <ellipse cx="400" cy="252" rx="210" ry="58" fill="#ff2bd6" opacity="0.4" filter="url(#gm-blur)"/>
      <circle cx="400" cy="252" r="66" fill="#ffb020" opacity="0.22" filter="url(#gm-blur)"/>
      <circle cx="400" cy="252" r="52" fill="none" stroke="#ffd166" stroke-width="3" stroke-opacity="0.85"/>
      <g stroke="#3ff0ff" stroke-opacity="0.45" stroke-width="1.5">
        <path d="M177 272 H623"/>
        <path d="M177 292 H623"/>
        <path d="M177 316 H623"/>
        <path d="M177 346 H623"/>
        <path d="M400 252 L177 358"/>
        <path d="M400 252 L262 358"/>
        <path d="M400 252 L340 358"/>
        <path d="M400 252 L460 358"/>
        <path d="M400 252 L538 358"/>
        <path d="M400 252 L623 358"/>
      </g>
      <path d="M236 132 L332 96 L300 196 Z" fill="#ff2bd6" opacity="0.9"/>
      <path d="M470 104 L572 148 L506 208 Z" fill="#3ff0ff" opacity="0.85"/>
      <path d="M330 214 L392 182 L430 250 Z" fill="#ffd166" opacity="0.9"/>
      <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
        <path d="M214 320 L282 320"/>
        <path d="M214 338 L258 338"/>
      </g>
    </g>
    <rect x="177" y="72" width="446" height="286" rx="10" fill="none" stroke="#3ff0ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="400" cy="66" r="3" fill="#5a6480"/>
    <rect x="382" y="362" width="36" height="4" rx="2" fill="#4a5470"/>
  </g>

  <rect x="185" y="360" width="430" height="18" rx="9" fill="#1a1f2e"/>

  <path d="M128 372 H672 L704 430 Q708 442 695 442 H105 Q92 442 96 430 Z" fill="url(#gm-metal)"/>
  <path d="M128 372 H672 L704 430 Q708 442 695 442 H105 Q92 442 96 430 Z" fill="none" stroke="url(#gm-rgb)" stroke-width="2.5" stroke-opacity="0.8"/>
  <g clip-path="url(#gm-kb)">
    <rect x="120" y="380" width="560" height="40" fill="url(#gm-keys)"/>
  </g>
  <g clip-path="url(#gm-kb)" opacity="0.9">
    <path d="M150 386 H650 L670 414 H130 Z" fill="none" stroke="#3ff0ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M300 386 L284 414" stroke="#ff2bd6" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M500 386 L516 414" stroke="#3ff0ff" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>
  <rect x="344" y="418" width="112" height="18" rx="6" fill="#1b2030" stroke="#3ff0ff" stroke-opacity="0.5"/>
  <g>
    <rect x="300" y="436" width="56" height="6" rx="3" fill="#ff2bd6" opacity="0.95"/>
    <rect x="372" y="436" width="56" height="6" rx="3" fill="#8a2be2" opacity="0.95"/>
    <rect x="444" y="436" width="56" height="6" rx="3" fill="#3ff0ff" opacity="0.95"/>
  </g>
</svg>
