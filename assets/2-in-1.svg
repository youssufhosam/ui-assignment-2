<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="cw-title cw-desc">
  <title id="cw-title">2-in-1 convertible laptop</title>
  <desc id="cw-desc">Flat vector illustration of a teal convertible 2-in-1 laptop whose screen shows a flowing aqua ribbon, floating circles and a stylus.</desc>
  <defs>
    <linearGradient id="cw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbfa"/>
      <stop offset="1" stop-color="#c3ecef"/>
    </linearGradient>
    <linearGradient id="cw-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ffff"/>
      <stop offset="0.5" stop-color="#bcd9da"/>
      <stop offset="1" stop-color="#8fb4b7"/>
    </linearGradient>
    <linearGradient id="cw-wall" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0d6a72"/>
      <stop offset="0.5" stop-color="#10979e"/>
      <stop offset="1" stop-color="#0a4f6b"/>
    </linearGradient>
    <linearGradient id="cw-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#8df5e4"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <pattern id="cw-keys" width="26" height="20" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="22" height="16" rx="4" fill="#24464a" fill-opacity="0.85"/>
    </pattern>
    <clipPath id="cw-scr">
      <rect x="177" y="72" width="446" height="286" rx="10"/>
    </clipPath>
    <clipPath id="cw-kb">
      <path d="M150 386 H650 L670 414 H130 Z"/>
    </clipPath>
    <filter id="cw-blur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="30" fill="url(#cw-bg)"/>
  <circle cx="400" cy="235" r="160" fill="#ffffff" opacity="0.5" filter="url(#cw-blur)"/>
  <circle cx="610" cy="150" r="80" fill="#10979e" opacity="0.18" filter="url(#cw-blur)"/>
  <ellipse cx="400" cy="452" rx="245" ry="16" fill="#14424a" opacity="0.2" filter="url(#cw-blur)"/>

  <g>
    <rect x="165" y="60" width="470" height="310" rx="18" fill="url(#cw-metal)"/>
    <rect x="177" y="72" width="446" height="286" rx="10" fill="#062a33"/>
    <g clip-path="url(#cw-scr)">
      <rect x="177" y="72" width="446" height="286" fill="url(#cw-wall)"/>
      <circle cx="300" cy="130" r="90" fill="#0f8f97" opacity="0.55" filter="url(#cw-blur)"/>
      <path d="M150 300 C 240 230, 330 300, 410 250 S 560 180, 660 236" fill="none" stroke="url(#cw-ribbon)" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
      <path d="M150 330 C 250 292, 320 352, 430 318 S 580 268, 660 300" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="7" stroke-linecap="round"/>
      <g fill="#ffffff">
        <circle cx="236" cy="196" r="10" opacity="0.75"/>
        <circle cx="560" cy="128" r="7" opacity="0.55"/>
        <circle cx="530" cy="330" r="13" opacity="0.35"/>
        <circle cx="286" cy="332" r="5" opacity="0.45"/>
      </g>
      <g transform="rotate(-28 520 250)">
        <rect x="508" y="150" width="24" height="110" rx="12" fill="#ffffff" opacity="0.9"/>
        <path d="M508 250 L520 282 L532 250 Z" fill="#ffd166"/>
      </g>
      <path d="M177 72 H 320 L 210 358 H 177 Z" fill="#ffffff" opacity="0.09"/>
    </g>
    <rect x="177" y="72" width="446" height="286" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="400" cy="66" r="3" fill="#7f9b9d"/>
    <rect x="382" y="362" width="36" height="4" rx="2" fill="#87a5a7"/>
  </g>

  <rect x="185" y="360" width="430" height="18" rx="9" fill="#87a5a7"/>

  <path d="M128 372 H672 L704 430 Q708 442 695 442 H105 Q92 442 96 430 Z" fill="url(#cw-metal)"/>
  <g clip-path="url(#cw-kb)">
    <rect x="120" y="380" width="560" height="40" fill="url(#cw-keys)"/>
  </g>
  <path d="M150 386 H650 L670 414 H130 Z" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="344" y="418" width="112" height="18" rx="6" fill="#a9c9cb" stroke="#ffffff" stroke-opacity="0.55"/>
  <path d="M104 441 H696" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M150 372 H650" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2"/>
</svg>
